<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ふたりごはん</title>
  <style>
    :root{--ink:#26322d;--muted:#758079;--cream:#fbf8f1;--card:#fff;--mint:#cce9d8;--green:#39745a;--coral:#ff927e;--line:#e5e8e2;--shadow:0 12px 36px #384b4020}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Yu Gothic UI","Hiragino Sans",sans-serif}.shell{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 96px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--coral)}.avatar{width:38px;height:38px;border-radius:50%;background:var(--mint);display:grid;place-items:center}.hero{background:linear-gradient(135deg,#dff2e7,#fff0e8);border-radius:26px;padding:22px;box-shadow:var(--shadow)}.hero-top{display:flex;justify-content:space-between;align-items:center}.date{font-size:13px;color:var(--muted)}.switch{display:flex;background:#ffffffa8;padding:4px;border-radius:14px}.switch button{border:0;background:transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}.switch .active{background:#fff;color:var(--green);font-weight:700;box-shadow:0 3px 10px #0001}.ring-row{display:flex;gap:22px;align-items:center;margin-top:20px}.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 0%,#ffffffaa 0);position:relative}.ring:after{content:"";position:absolute;inset:12px;background:#f6fbf7;border-radius:50%}.ring strong,.ring small{position:relative;z-index:1;display:block;text-align:center}.ring strong{font-size:25px}.ring small{font-size:11px;color:var(--muted)}.stats{flex:1;display:grid;gap:10px}.stat{background:#ffffffa8;padding:10px 12px;border-radius:14px}.stat b{float:right}.bar{height:5px;background:#e8ece8;border-radius:8px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--coral);width:0}.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}.section-head h2{font-size:17px;margin:0}.section-head button{border:0;background:none;color:var(--green);font-weight:700}.meals{display:grid;gap:11px}.meal{display:flex;gap:13px;align-items:center;background:var(--card);padding:12px;border-radius:18px;border:1px solid var(--line)}.thumb{width:58px;height:58px;border-radius:14px;object-fit:cover;background:#eef1ec;display:grid;place-items:center;font-size:25px}.meal main{flex:1}.meal h3{font-size:14px;margin:0 0 5px}.meta{font-size:12px;color:var(--muted)}.kcal{font-weight:800;font-size:14px}.empty{padding:32px;text-align:center;color:var(--muted);background:#fff;border-radius:18px}.fab{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);border:0;background:var(--ink);color:white;border-radius:18px;padding:15px 25px;font-weight:800;box-shadow:0 10px 25px #26322d55}dialog{border:0;border-radius:26px;padding:0;width:min(92vw,480px);box-shadow:var(--shadow)}dialog::backdrop{background:#1a2a2277}.modal{padding:22px}.modal h2{margin:0 0 18px}.upload{height:150px;border:2px dashed #bdd2c5;border-radius:20px;display:grid;place-items:center;text-align:center;background:#f7fbf8;overflow:hidden}.upload img{width:100%;height:100%;object-fit:cover}.upload input{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}label{font-size:12px;color:var(--muted)}input,select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:inherit}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:13px;border-radius:13px;border:0;font-weight:800}.cancel{background:#eef0ed}.save{background:var(--green);color:#fff}.notice{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
  </style>
</head>
<body><div class="shell"><header><div class="brand">ふたり<span>ごはん</span></div><div class="avatar">🥑</div></header><section class="hero"><div class="hero-top"><div><b>今日の記録</b><div class="date" id="date"></div></div><div class="switch"><button class="active" data-who="me">わたし</button><button data-who="partner">パートナー</button></div></div><div class="ring-row"><div class="ring" id="ring"><div><strong id="total">0</strong><small>/ 1,800 kcal</small></div></div><div class="stats"><div class="stat">たんぱく質 <b id="protein">0g</b><div class="bar"><i id="pbar"></i></div></div><div class="stat">脂質 <b id="fat">0g</b><div class="bar"><i id="fbar"></i></div></div><div class="stat">炭水化物 <b id="carbs">0g</b><div class="bar"><i id="cbar"></i></div></div></div></div></section><div class="section-head"><h2 id="listTitle">わたしの食事</h2><button id="seed">サンプルを追加</button></div><div class="meals" id="meals"></div></div><button class="fab" id="add">＋ 食事を記録</button>
<dialog id="dialog"><form class="modal" id="form"><h2>食事を記録</h2><label class="upload" for="photo" id="preview"><span>📷<br><b>写真を撮る・選ぶ</b></span></label><input id="photo" type="file" accept="image/*" capture="environment"><div class="grid"><label>食事区分<select id="type"><option>朝食</option><option>昼食</option><option>夕食</option><option>間食</option></select></label><label>記録する人<select id="owner"><option value="me">わたし</option><option value="partner">パートナー</option></select></label></div><label style="display:block;margin-top:12px">食べたもの<input id="name" required placeholder="例：鮭おにぎり、味噌汁"></label><div class="grid"><label>カロリー<input id="kcal" type="number" placeholder="自動推定"></label><label>たんぱく質(g)<input id="prot" type="number" step="0.1" placeholder="自動推定"></label><label>脂質(g)<input id="fatInput" type="number" step="0.1" placeholder="自動推定"></label><label>炭水化物(g)<input id="carbInput" type="number" step="0.1" placeholder="自動推定"></label></div><p class="notice">料理名を入力すると一般的な1人前から栄養を推定します。写真AI連携後は画像から候補と量を自動入力できます。</p><div class="actions"><button type="button" class="cancel" id="cancel">閉じる</button><button class="save">記録する</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s), key='futari-gohan-v1'; let who='me', photo='';
const db={"鮭おにぎり":[190,5,2,38],"味噌汁":[45,3,2,5],"サラダチキン":[120,24,2,3],"カレーライス":[720,18,24,105],"ヨーグルト":[90,5,3,12],"バナナ":[93,1,0,23],"トースト":[260,8,9,38]};
let items=JSON.parse(localStorage.getItem(key)||'[]'); $('#date').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
function render(){const xs=items.filter(x=>x.owner===who), sum=k=>Math.round(xs.reduce((a,x)=>a+(+x[k]||0),0)*10)/10; $('#total').textContent=sum('kcal').toLocaleString(); $('#protein').textContent=sum('protein')+'g';$('#fat').textContent=sum('fat')+'g';$('#carbs').textContent=sum('carbs')+'g';$('#ring').style.background=`conic-gradient(var(--green) ${Math.min(100,sum('kcal')/18)}%,#ffffffaa 0)`;$('#pbar').style.width=Math.min(100,sum('protein')/0.9)+'%';$('#fbar').style.width=Math.min(100,sum('fat')/0.6)+'%';$('#cbar').style.width=Math.min(100,sum('carbs')/2.3)+'%';$('#listTitle').textContent=who==='me'?'わたしの食事':'パートナーの食事';$('#meals').innerHTML=xs.length?xs.map(x=>`<article class="meal">${x.photo?`<img class="thumb" src="${x.photo}">`:`<div class="thumb">${x.type==='間食'?'🍌':'🍽️'}</div>`}<main><h3>${esc(x.name)}</h3><div class="meta">${x.type}・P ${x.protein}g / F ${x.fat}g / C ${x.carbs}g</div></main><div class="kcal">${x.kcal} kcal</div></article>`).join(''):'<div class="empty">まだ記録がありません<br>今日の食事を追加しましょう</div>'}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.remove('active'));b.classList.add('active');who=b.dataset.who;render()});
$('#add').onclick=()=>{$('#owner').value=who;$('#dialog').showModal()};$('#cancel').onclick=()=>$('#dialog').close();
$('#name').onblur=()=>{let hit=Object.entries(db).find(([n])=>$('#name').value.includes(n));if(hit){let v=hit[1];$('#kcal').value=v[0];$('#prot').value=v[1];$('#fatInput').value=v[2];$('#carbInput').value=v[3]}};
$('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{photo=r.result;$('#preview').innerHTML=`<img src="${photo}">`};r.readAsDataURL(f)};
$('#form').onsubmit=e=>{e.preventDefault();items.unshift({owner:$('#owner').value,type:$('#type').value,name:$('#name').value,kcal:+$('#kcal').value||0,protein:+$('#prot').value||0,fat:+$('#fatInput').value||0,carbs:+$('#carbInput').value||0,photo});localStorage.setItem(key,JSON.stringify(items));who=$('#owner').value;photo='';e.target.reset();$('#preview').innerHTML='<span>📷<br><b>写真を撮る・選ぶ</b></span>';$('#dialog').close();document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('active',x.dataset.who===who));render()};
$('#seed').onclick=()=>{items.push({owner:'me',type:'朝食',name:'トーストとヨーグルト',kcal:350,protein:13,fat:12,carbs:50,photo:''},{owner:'partner',type:'昼食',name:'サラダチキン',kcal:120,protein:24,fat:2,carbs:3,photo:''});localStorage.setItem(key,JSON.stringify(items));render()};render();
</script></body></html>
